<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07060d">
<title>Yakında</title>
<style>
  html, body { margin: 0; height: 100%; background: #07060d; overflow: hidden; }
  body { display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, #24123a, #07060d 60%); }
  .ip { position: absolute; top: 0; left: 50%; width: 1px; height: calc(42vh - 70px); background: linear-gradient(#0000, #8a8f9a); }
  .top {
    position: absolute; top: calc(42vh - 70px); left: 50%; width: 140px; height: 140px; margin-left: -70px; border-radius: 50%;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.55) 0 1px, transparent 1px 11px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.55) 0 1px, transparent 1px 11px),
      radial-gradient(circle at 34% 30%, #9aa0ab, #3a3d46 55%, #15151b);
    box-shadow: inset -14px -18px 30px rgba(0,0,0,.6);
    animation: salin 6s ease-in-out infinite; transform-origin: 50% -42vh;
  }
  @keyframes salin { 50% { transform: rotate(1.2deg); } }
</style>
</head>
<body>
  <div class="ip"></div>
  <div class="top" role="img" aria-label="Sönük bir disko topu"></div>
</body>
</html>
